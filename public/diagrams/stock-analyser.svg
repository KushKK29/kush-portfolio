<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .box { fill:#1e293b; stroke:#3b82f6; stroke-width:1.5; }
    .box2 { fill:#1e293b; stroke:#475569; stroke-width:1.5; }
    .t { fill:#e2e8f0; font-size:15px; font-weight:600; text-anchor:middle; }
    .s { fill:#94a3b8; font-size:11.5px; text-anchor:middle; }
    .l { fill:#94a3b8; font-size:11.5px; text-anchor:middle; }
    .e { stroke:#64748b; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .bug { fill:#7f1d1d; stroke:#ef4444; stroke-width:1.2; }
    .bt { fill:#fecaca; font-size:12px; font-weight:700; text-anchor:middle; }
    .bl { fill:#fca5a5; font-size:12px; }
  </style>

  <rect class="box" x="40" y="90" width="200" height="70" rx="10"/>
  <text class="t" x="140" y="120">Browser UI</text>
  <text class="s" x="140" y="140">Gradio client</text>

  <rect class="box" x="380" y="70" width="280" height="110" rx="10"/>
  <text class="t" x="520" y="102">Hugging Face Space</text>
  <text class="s" x="520" y="124">Gradio server · Python runtime</text>
  <text class="s" x="520" y="142">analysis code</text>

  <rect class="box2" x="780" y="90" width="180" height="70" rx="10"/>
  <text class="t" x="870" y="120">Market data</text>
  <text class="s" x="870" y="140">yfinance</text>

  <line class="e" x1="240" y1="125" x2="376" y2="125"/>
  <text class="l" x="308" y="115">API calls</text>
  <line class="e" x1="660" y1="125" x2="776" y2="125"/>
  <text class="l" x="718" y="115">fetch quotes</text>

  <!-- failure points -->
  <circle class="bug" cx="308" cy="150" r="11"/><text class="bt" x="308" y="154">1</text>
  <circle class="bug" cx="520" cy="192" r="11"/><text class="bt" x="520" y="196">2</text>
  <circle class="bug" cx="240" cy="90" r="11"/><text class="bt" x="240" y="94">3</text>

  <text class="bl" x="60" y="270">1 — SDK mismatch: Gradio client and server versions drifted → API contract broke. Fix: pin matching versions.</text>
  <text class="bl" x="60" y="300">2 — Python 3.13 removed stdlib audioop; a transitive dependency imported it. Fix: pin the runtime version.</text>
  <text class="bl" x="60" y="330">3 — CORS blocked cross-origin browser calls. Fix: serve UI and API from the same origin via Gradio.</text>
</svg>
